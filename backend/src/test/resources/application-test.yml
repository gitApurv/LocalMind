# Test profile: lets @SpringBootTest contexts start without MySQL, Qdrant or Ollama.
# Activate with @ActiveProfiles("test"). Live tests that need the real stack are tagged "live".
spring:
  datasource:
    url: jdbc:h2:mem:localmind;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  ai:
    vectorstore:
      qdrant:
        initialize-schema: false

localmind:
  jwt:
    key-file: ${java.io.tmpdir}/localmind-test-jwt-signing-key.pem
  storage:
    upload-dir: ${java.io.tmpdir}/localmind-test-uploads
